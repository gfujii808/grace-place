<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Place — Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .sidebar { width: 360px; max-height: 100vh; overflow-y: auto; }
        @media (max-width: 768px) { .sidebar { width: 100%; max-height: 50vh; } }
    </style>
</head>
<body class="bg-stone-50">
    <div class="flex h-screen gap-0">
        <!-- Map -->
        <div class="flex-1 relative">
            <div id="map"></div>
        </div>
        
        <!-- Sidebar -->
        <div class="sidebar bg-white border-l border-stone-200 flex flex-col">
            <!-- Tabs -->
            <div class="flex border-b border-stone-200 sticky top-0 bg-white">
                <button id="tab-places" class="flex-1 px-4 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-600">Places</button>
                <button id="tab-add" class="flex-1 px-4 py-3 text-sm font-medium border-b-2 border-transparent text-stone-600 hover:text-stone-900">Add</button>
                <button id="tab-reading" class="flex-1 px-4 py-3 text-sm font-medium border-b-2 border-transparent text-stone-600 hover:text-stone-900">Reading</button>
            </div>
            
            <!-- Places Tab -->
            <div id="content-places" class="flex-1 overflow-y-auto p-4">
                <input type="text" id="search" placeholder="Search places..." class="w-full px-3 py-2 border border-stone-200 rounded-lg mb-4 text-sm">
                
                <div class="space-y-1">
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-blue-100 text-blue-700" data-filter="all">All Places</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Food">🍽 Food</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Shopping">🛍 Shopping</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Views">👁 Views</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Walking/Running">🥾 Walking/Running</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Experience">✨ Experience</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Books">📚 Books</button>
                    <button class="filter-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-stone-700 hover:bg-stone-100" data-filter="Misc">💡 Misc</button>
                </div>
                
                <div id="places-list" class="mt-6 space-y-3"></div>
            </div>
            
            <!-- Add Tab -->
            <div id="content-add" class="hidden flex-1 overflow-y-auto p-4">
                <form id="add-place-form" class="space-y-3">
                    <input type="text" id="form-title" placeholder="Place name" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm" required>
                    <input type="text" id="form-address" placeholder="Address" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <input type="url" id="form-link" placeholder="Link (optional)" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <select id="form-category" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                        <option value="Food">Food</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Books">Books</option>
                        <option value="Experience">Experience</option>
                    </select>
                    <input type="text" id="form-price" placeholder="Price ($$, $$, etc)" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <textarea id="form-notes" placeholder="Notes" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm h-20"></textarea>
                    <button type="submit" class="w-full px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Add Place</button>
                </form>
            </div>
            
            <!-- Reading Tab -->
            <div id="content-reading" class="hidden flex-1 overflow-y-auto p-4">
                <div class="space-y-2">
                    <input type="text" id="reading-title" placeholder="Book title" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <input type="text" id="reading-author" placeholder="Author" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <input type="url" id="reading-link" placeholder="Link (optional)" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm">
                    <textarea id="reading-notes" placeholder="Notes" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm h-20"></textarea>
                    <button id="add-reading-btn" class="w-full px-3 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Add to Reading List</button>
                </div>
                <div id="reading-list" class="mt-6 space-y-3"></div>
            </div>
        </div>
    </div>
    
    <!-- Place Detail Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-md w-full max-h-96 overflow-y-auto">
            <div class="p-6 space-y-4">
                <h2 id="modal-title" class="text-2xl font-bold"></h2>
                <div id="modal-content" class="space-y-3 text-sm"></div>
                <button id="close-modal" class="w-full px-3 py-2 bg-stone-200 rounded-lg hover:bg-stone-300">Close</button>
            </div>
        </div>
    </div>

    <script>
        // ── State ─────────────────────────────────────────────
        let places = [];
        let reading = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let mapReady = false;
        let dataReady = false;

        // ── Map ───────────────────────────────────────────────
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ3JhY2VmODA4IiwiYSI6ImNtdWo2NGF5dDAxNGkyd29qaHpsd3UweWUifQ.Mf9Y1d9e_qIl7EEs2bTmgw';
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            center: [133, -25],   // centre of Australia + world view
            zoom: 2
        });

        map.on('load', () => {
            mapReady = true;
            if (dataReady) renderMap();
        });

        // ── Data ──────────────────────────────────────────────
        fetch('./data.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .catch(() => ({ places: [] }))
            .then(data => {
                places = data.places || [];
                dataReady = true;
                renderPlaces();
                if (mapReady) renderMap();
            });

        // ── Tabs ──────────────────────────────────────────────
        ['places', 'add', 'reading'].forEach(tab => {
            document.getElementById(`tab-${tab}`).addEventListener('click', () => {
                document.querySelectorAll('[id^="content-"]').forEach(el => el.classList.add('hidden'));
                document.getElementById(`content-${tab}`).classList.remove('hidden');
                document.querySelectorAll('[id^="tab-"]').forEach(el => {
                    el.classList.remove('border-blue-500', 'text-blue-600');
                    el.classList.add('border-transparent', 'text-stone-600');
                });
                document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-stone-600');
                document.getElementById(`tab-${tab}`).classList.add('border-blue-500', 'text-blue-600');
            });
        });

        // ── Filter ────────────────────────────────────────────
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-blue-100', 'text-blue-700');
                    b.classList.add('text-stone-700');
                });
                btn.classList.add('bg-blue-100', 'text-blue-700');
                btn.classList.remove('text-stone-700');
                currentFilter = btn.dataset.filter;
                renderPlaces();
            });
        });

        // ── Search ────────────────────────────────────────────
        document.getElementById('search').addEventListener('input', e => {
            currentSearch = e.target.value.toLowerCase();
            renderPlaces();
        });

        // ── Render Places List ────────────────────────────────
        function renderPlaces() {
            const filtered = places.filter(p => {
                const cat = (p.category || '').toLowerCase();
                const filter = currentFilter.toLowerCase();
                const matchCat = filter === 'all' || cat === filter;
                const matchSearch = !currentSearch
                    || (p.title || '').toLowerCase().includes(currentSearch)
                    || (p.address || '').toLowerCase().includes(currentSearch);
                return matchCat && matchSearch;
            });

            document.getElementById('places-list').innerHTML = filtered.map((p, i) => `
                <div class="p-3 border border-stone-200 rounded-lg cursor-pointer hover:bg-stone-50" data-idx="${i}">
                    <div class="font-medium text-sm">${p.title || ''}</div>
                    <div class="text-xs text-stone-500">${p.category || ''} ${p.price ? '· ' + p.price : ''}</div>
                    ${p.address ? `<div class="text-xs text-stone-400 mt-0.5">${p.address}</div>` : ''}
                </div>
            `).join('');

            document.querySelectorAll('[data-idx]').forEach(el => {
                el.addEventListener('click', () => {
                    showModal(filtered[parseInt(el.dataset.idx)]);
                });
            });
        }

        // ── Render Map Pins ───────────────────────────────────
        function renderMap() {
            const catColors = {
                food: '#ef4444',
                shopping: '#8b5cf6',
                books: '#f59e0b',
                experience: '#10b981',
                views: '#0ea5e9',
                'walking/running': '#84cc16',
                misc: '#f97316'
            };

            places.forEach(p => {
                const lat = parseFloat(p.lat);
                const lng = parseFloat(p.lng);
                if (!lat || !lng) return;

                const color = catColors[(p.category || '').toLowerCase()] || '#3b82f6';

                const el = document.createElement('div');
                el.style.cssText = `
                    width: 12px; height: 12px;
                    background: ${color};
                    border: 2px solid white;
                    border-radius: 50%;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
                    cursor: pointer;
                `;

                new mapboxgl.Marker(el)
                    .setLngLat([lng, lat])
                    .setPopup(new mapboxgl.Popup({ offset: 10 }).setHTML(
                        `<strong>${p.title}</strong><br><span style="font-size:12px;color:#666">${p.category || ''}${p.price ? ' · ' + p.price : ''}</span>`
                    ))
                    .addTo(map);

                el.addEventListener('click', () => showModal(p));
            });
        }

        // ── Modal ─────────────────────────────────────────────
        function showModal(p) {
            document.getElementById('modal-title').textContent = p.title || '';
            document.getElementById('modal-content').innerHTML = `
                ${p.category ? `<div class="text-xs font-semibold uppercase tracking-wide text-stone-400">${p.category}</div>` : ''}
                ${p.address  ? `<div><strong>Address:</strong> ${p.address}</div>` : ''}
                ${p.price    ? `<div><strong>Price:</strong> ${p.price}</div>` : ''}
                ${p.notes    ? `<div><strong>Notes:</strong> ${p.notes}</div>` : ''}
                ${p.link     ? `<div><a href="${p.link}" target="_blank" rel="noopener" class="text-blue-600 underline">Visit ↗</a></div>` : ''}
            `;
            document.getElementById('modal').classList.remove('hidden');
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('modal').classList.add('hidden');
        });

        // ── Add Place ─────────────────────────────────────────
        document.getElementById('add-place-form').addEventListener('submit', e => {
            e.preventDefault();
            places.push({
                id: `user-${Date.now()}`,
                title:    document.getElementById('form-title').value,
                address:  document.getElementById('form-address').value,
                link:     document.getElementById('form-link').value,
                category: document.getElementById('form-category').value,
                price:    document.getElementById('form-price').value,
                notes:    document.getElementById('form-notes').value,
                lat: null, lng: null
            });
            document.getElementById('add-place-form').reset();
            renderPlaces();
        });

        // ── Reading List ──────────────────────────────────────
        document.getElementById('add-reading-btn').addEventListener('click', () => {
            const title = document.getElementById('reading-title').value.trim();
            if (!title) return;
            reading.push({
                title,
                author: document.getElementById('reading-author').value,
                link:   document.getElementById('reading-link').value,
                notes:  document.getElementById('reading-notes').value
            });
            ['reading-title','reading-author','reading-link','reading-notes']
                .forEach(id => document.getElementById(id).value = '');
            renderReading();
        });

        function renderReading() {
            document.getElementById('reading-list').innerHTML = reading.map(b => `
                <div class="p-3 border border-stone-200 rounded-lg">
                    <div class="font-medium text-sm">${b.title}</div>
                    ${b.author ? `<div class="text-xs text-stone-500">${b.author}</div>` : ''}
                    ${b.link   ? `<a href="${b.link}" target="_blank" class="text-xs text-blue-600 underline">Link ↗</a>` : ''}
                    ${b.notes  ? `<div class="text-xs text-stone-400 mt-1">${b.notes}</div>` : ''}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
