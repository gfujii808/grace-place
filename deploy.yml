name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Inject Mapbox token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          # Create a script that injects the token into the HTML
          echo "Creating token injection..."
          cat > /tmp/inject-token.html << 'INJECT'
          <script>
            window.MAPBOX_TOKEN = '${{ secrets.MAPBOX_TOKEN }}';
          </script>
          INJECT
      
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
