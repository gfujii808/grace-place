name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate config.js with token
        run: |
          cat > config.js << 'CONFIGEOF'
          window.MAPBOX_TOKEN = '${{ secrets.MAPBOX_TOKEN }}';
          CONFIGEOF
          cat config.js
      
      - name: Upload config.js
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: config.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          cname: 
