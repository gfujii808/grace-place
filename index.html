<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace Place</title>
<script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
<link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet'/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;height:100vh;overflow:hidden;background:#fafaf9}
#map-wrap{flex:1;position:relative}
#map{position:absolute;inset:0}
#sidebar{width:340px;height:100vh;display:flex;flex-direction:column;background:#fff;border-left:1px solid #e7e5e4;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid #e7e5e4;flex-shrink:0}
.tab{flex:1;padding:12px 8px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:#78716c;border-bottom:2px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.panel{display:none;flex:1;overflow-y:auto;padding:12px}
.panel.active{display:flex;flex-direction:column;gap:8px}
#search{width:100%;padding:8px 12px;border:1px solid #e7e5e4;border-radius:8px;font-size:13px;outline:none}
#search:focus{border-color:#93c5fd}
.filters{display:flex;flex-direction:column;gap:4px}
.fbtn{width:100%;text-align:left;padding:7px 12px;border-radius:8px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#57534e}
.fbtn:hover{background:#f5f5f4}
.fbtn.active{background:#dbeafe;color:#1d4ed8}
.count{font-size:11px;font-weight:400;color:#a8a29e;float:right;margin-top:1px}
.place-card{padding:10px 12px;border:1px solid #e7e5e4;border-radius:8px;cursor:pointer;transition:background .1s}
.place-card:hover{background:#fafaf9}
.place-title{font-size:13px;font-weight:600;color:#1c1917}
.place-meta{font-size:11px;color:#a8a29e;margin-top:2px}
.place-addr{font-size:11px;color:#c7c3c0;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#places-list{display:flex;flex-direction:column;gap:6px}
/* Modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.modal-title{font-size:20px;font-weight:700;color:#1c1917}
.modal-cat{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#a8a29e}
.modal-row{font-size:13px;color:#44403c}
.modal-row strong{color:#1c1917}
.modal-link{font-size:13px;color:#2563eb;text-decoration:none}
.modal-link:hover{text-decoration:underline}
.close-btn{margin-top:4px;padding:8px;background:#f5f5f4;border:none;border-radius:8px;cursor:pointer;font-size:13px;color:#57534e;font-weight:500}
.close-btn:hover{background:#e7e5e4}
/* Add/Reading forms */
.form-group{display:flex;flex-direction:column;gap:4px}
label{font-size:12px;font-weight:500;color:#78716c}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #e7e5e4;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#93c5fd}
textarea{resize:vertical;min-height:64px}
.submit-btn{width:100%;padding:9px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.submit-btn:hover{background:#1d4ed8}
.book-card{padding:10px 12px;border:1px solid #e7e5e4;border-radius:8px}
.book-title{font-size:13px;font-weight:600}
.book-meta{font-size:11px;color:#a8a29e;margin-top:2px}
</style>
</head>
<body>
<div id="map-wrap"><div id="map"></div></div>
<div id="sidebar">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="places">Places</button>
    <button class="tab" data-tab="add">Add</button>
    <button class="tab" data-tab="reading">Reading</button>
  </div>

  <!-- Places panel -->
  <div class="panel active" id="panel-places">
    <input id="search" placeholder="Search 675 places…" type="search">
    <div class="filters" id="filters"></div>
    <div id="places-list"></div>
  </div>

  <!-- Add panel -->
  <div class="panel" id="panel-add">
    <div class="form-group"><label>Name</label><input id="f-title" placeholder="Place name"></div>
    <div class="form-group"><label>Address</label><input id="f-addr" placeholder="Address"></div>
    <div class="form-group"><label>Link</label><input id="f-link" placeholder="https://..." type="url"></div>
    <div class="form-group"><label>Category</label>
      <select id="f-cat">
        <option>Food</option><option>Shopping</option><option>Views</option>
        <option>Walking/Running</option><option>Experience</option><option>Books</option><option>Misc</option>
      </select>
    </div>
    <div class="form-group"><label>Price</label><input id="f-price" placeholder="$, $$, $$$"></div>
    <div class="form-group"><label>Notes</label><textarea id="f-notes" placeholder="Notes…"></textarea></div>
    <button class="submit-btn" id="add-btn">Add Place</button>
  </div>

  <!-- Reading panel -->
  <div class="panel" id="panel-reading">
    <div class="form-group"><label>Title</label><input id="r-title" placeholder="Book title"></div>
    <div class="form-group"><label>Author</label><input id="r-author" placeholder="Author"></div>
    <div class="form-group"><label>Link</label><input id="r-link" placeholder="https://" type="url"></div>
    <div class="form-group"><label>Notes</label><textarea id="r-notes" placeholder="Notes…"></textarea></div>
    <button class="submit-btn" id="reading-add-btn">Add to Reading List</button>
    <div id="reading-list" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-cat" id="m-cat"></div>
    <div class="modal-title" id="m-title"></div>
    <div id="m-body"></div>
    <button class="close-btn" id="close-modal">Close</button>
  </div>
</div>

// ── Map ──────────────────────────────────────────────────────
mapboxgl.accessToken = 'pk.eyJ1IjoiZ3JhY2VmODA4IiwiYSI6ImNtdWo2NGF5dDAxNGkyd29qaHpsd3UweWUifQ.Mf9Y1d9e_qIl7EEs2bTmgw';
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/light-v11',
  center: [20, 20],
  zoom: 1.5
});
map.addControl(new mapboxgl.NavigationControl(), 'bottom-right');

const CAT_COLORS = {"food": "#ef4444", "shopping": "#8b5cf6", "views": "#0ea5e9", "walking/running": "#84cc16", "misc": "#f97316", "experience": "#10b981", "books": "#f59e0b"};

function pinColor(cat) {
  return CAT_COLORS[(cat||'').toLowerCase()] || '#6b7280';
}

// ── State ────────────────────────────────────────────────────
let activeFilter = 'all';
let searchQuery  = '';
let reading      = [];

// ── Categories ───────────────────────────────────────────────
const CATS = ['Food','Shopping','Views','Walking/Running','Experience','Books','Misc'];
const CAT_ICONS = {'Food':'🍽','Shopping':'🛍','Views':'👁','Walking/Running':'🥾','Experience':'✨','Books':'📚','Misc':'💡'};

function countFor(cat) {
  return ALL_PLACES.filter(p => (p.c||'') === cat).length;
}

function buildFilters() {
  const wrap = document.getElementById('filters');
  const total = ALL_PLACES.length;
  let html = `<button class="fbtn active" data-cat="all">All Places <span class="count">${total}</span></button>`;
  CATS.forEach(cat => {
    const n = countFor(cat);
    if (n === 0) return;
    const icon = CAT_ICONS[cat] || '';
    html += `<button class="fbtn" data-cat="${cat}">${icon} ${cat} <span class="count">${n}</span></button>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.cat;
      renderList();
    });
  });
}

// ── Filtered list ────────────────────────────────────────────
function filtered() {
  const q = searchQuery.toLowerCase();
  return ALL_PLACES.filter(p => {
    const catOk = activeFilter === 'all' || (p.c||'') === activeFilter;
    const qOk   = !q || (p.t||'').toLowerCase().includes(q) || (p.a||'').toLowerCase().includes(q) || (p.d||'').toLowerCase().includes(q);
    return catOk && qOk;
  });
}

function renderList() {
  const places = filtered();
  const list = document.getElementById('places-list');
  if (places.length === 0) {
    list.innerHTML = '<div style="font-size:13px;color:#a8a29e;padding:8px 0">No results</div>';
    return;
  }
  list.innerHTML = places.map((p,i) => `
    <div class="place-card" data-i="${i}">
      <div class="place-title">${esc(p.t)}</div>
      <div class="place-meta">${esc(p.c||'')}${p.p ? ' · '+esc(p.p) : ''}</div>
      ${p.a ? `<div class="place-addr">${esc(p.a)}</div>` : ''}
    </div>
  `).join('');
  list.querySelectorAll('.place-card').forEach(el => {
    el.addEventListener('click', () => showModal(filtered()[+el.dataset.i]));
  });
}

// ── Map pins ─────────────────────────────────────────────────
function renderPins() {
  ALL_PLACES.forEach(p => {
    const lat = parseFloat(p.lt), lng = parseFloat(p.ln);
    if (!lat || !lng) return;
    const dot = document.createElement('div');
    dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${pinColor(p.c)};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer`;
    new mapboxgl.Marker(dot)
      .setLngLat([lng, lat])
      .setPopup(new mapboxgl.Popup({offset:10,closeButton:false}).setHTML(
        `<strong style="font-size:13px">${esc(p.t)}</strong><br><span style="font-size:11px;color:#78716c">${esc(p.c)}${p.p?' · '+esc(p.p):''}</span>`
      ))
      .addTo(map);
    dot.addEventListener('click', () => showModal(p));
  });
}

map.on('load', renderPins);

// ── Modal ────────────────────────────────────────────────────
function showModal(p) {
  document.getElementById('m-cat').textContent   = p.c || '';
  document.getElementById('m-title').textContent = p.t || '';
  let body = '';
  if (p.d) body += `<div class="modal-row"><strong>Detail:</strong> ${esc(p.d)}</div>`;
  if (p.a) body += `<div class="modal-row"><strong>Address:</strong> ${esc(p.a)}</div>`;
  if (p.p) body += `<div class="modal-row"><strong>Price:</strong> ${esc(p.p)}</div>`;
  if (p.n) body += `<div class="modal-row"><strong>Notes:</strong> ${esc(p.n)}</div>`;
  if (p.l) body += `<div><a class="modal-link" href="${esc(p.l)}" target="_blank" rel="noopener">Visit ↗</a></div>`;
  document.getElementById('m-body').innerHTML = body;
  document.getElementById('modal').classList.add('open');
}
document.getElementById('close-modal').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('open'));
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
});

// ── Tabs ─────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  });
});

// ── Search ───────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

// ── Add place ────────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', () => {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return;
  ALL_PLACES.push({
    t: title,
    c: document.getElementById('f-cat').value,
    a: document.getElementById('f-addr').value,
    l: document.getElementById('f-link').value,
    p: document.getElementById('f-price').value,
    n: document.getElementById('f-notes').value,
  });
  ['f-title','f-addr','f-link','f-price','f-notes'].forEach(id => document.getElementById(id).value='');
  buildFilters();
  renderList();
});

// ── Reading list ─────────────────────────────────────────────
document.getElementById('reading-add-btn').addEventListener('click', () => {
  const title = document.getElementById('r-title').value.trim();
  if (!title) return;
  reading.push({title, author:document.getElementById('r-author').value, link:document.getElementById('r-link').value, notes:document.getElementById('r-notes').value});
  ['r-title','r-author','r-link','r-notes'].forEach(id => document.getElementById(id).value='');
  renderReading();
});
function renderReading() {
  document.getElementById('reading-list').innerHTML = reading.map(b => `
    <div class="book-card">
      <div class="book-title">${esc(b.title)}</div>
      ${b.author ? `<div class="book-meta">${esc(b.author)}</div>` : ''}
      ${b.link ? `<a class="modal-link" href="${esc(b.link)}" target="_blank">Link ↗</a>` : ''}
      ${b.notes ? `<div class="book-meta" style="margin-top:4px">${esc(b.notes)}</div>` : ''}
    </div>
  `).join('');
}

// ── Util ─────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ─────────────────────────────────────────────────────
buildFilters();
renderList();
</script>
</body>
</html>
